<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskMaster - Sign In</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="auth-page">

  <div id="toast-container"></div>

  <div class="auth-card">
    <div class="auth-header">
      <i class="fa-solid fa-list-check logo-icon"></i>
      <h1>TaskMaster</h1>
      <p>Manage your tasks efficiently and stay productive.</p>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="auth-form active">
      <h2>Sign In</h2>
      <div class="form-group">
        <label><i class="fa-solid fa-envelope"></i> Email</label>
        <input type="email" id="login-email" required placeholder="user@example.com" />
      </div>
      <div class="form-group">
        <label><i class="fa-solid fa-lock"></i> Password</label>
        <input type="password" id="login-password" required placeholder="••••••••" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">
        <i class="fa-solid fa-right-to-bracket"></i> Login
      </button>
      <p class="auth-toggle">
        Don't have an account? <a href="#" id="show-register">Register here</a>
      </p>
    </form>

    <!-- Register Form -->
    <form id="register-form" class="auth-form">
      <h2>Create Account</h2>
      <div class="form-group">
        <label><i class="fa-solid fa-user"></i> Username</label>
        <input type="text" id="reg-username" required placeholder="johndoe" />
      </div>
      <div class="form-group">
        <label><i class="fa-solid fa-envelope"></i> Email</label>
        <input type="email" id="reg-email" required placeholder="user@example.com" />
      </div>
      <div class="form-group">
        <label><i class="fa-solid fa-lock"></i> Password</label>
        <input type="password" id="reg-password" required placeholder="Min. 6 characters" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">
        <i class="fa-solid fa-user-plus"></i> Register
      </button>
      <p class="auth-toggle">
        Already have an account? <a href="#" id="show-login">Login here</a>
      </p>
    </form>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
